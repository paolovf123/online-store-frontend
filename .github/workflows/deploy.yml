name: Deploy

on:
  push:
    branches: [develop, main]

# Necesario para que GitHub firme el token OIDC que asume el rol AWS
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Environment para protección (reviewers en production, etc.).
    # Configurar en Settings → Environments → staging | production.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_REGION: us-east-1
      ENV_NAME: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit (alta/crítica falla el deploy)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests + coverage
        run: npm run test:ci

      - name: Inyectar BACKEND_URL desde SSM
        run: |
          BACKEND_URL=$(aws ssm get-parameter \
            --name "/online-store/${ENV_NAME}/backend-url" \
            --query 'Parameter.Value' --output text)
          echo "::add-mask::$BACKEND_URL"
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"
          BACKEND_URL="$BACKEND_URL" npm run inject-env

      - name: Build
        run: npm run build

      - name: Sync assets a S3 (cache-control inmutable)
        run: |
          aws s3 sync dist/solution-test-ventas/browser/ \
            "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Subir index.html sin cache
        run: |
          aws s3 cp dist/solution-test-ventas/browser/index.html \
            "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-store, no-cache, must-revalidate" \
            --content-type "text/html"

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
