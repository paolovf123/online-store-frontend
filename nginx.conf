# Sin directiva 'user': el contenedor corre como usuario no-root (nginx) desde el Dockerfile.
# Si se define 'user' aquí, nginx intentará setuid() y fallará sin CAP_SETUID.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Redirigir HTTP a HTTPS (opcional, descomenta si usas HTTPS)
        # return 301 https://$host$request_uri;

        # SPA - Redirigir todas las rutas a index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Cache para archivos estáticos (JS, CSS, etc.)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # No cachear index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Proxy reverso al backend Azure — solo para desarrollo local con docker-compose.
        # ${BACKEND_URL} es reemplazado por envsubst al arrancar el contenedor.
        # En producción (AWS CloudFront + S3) este bloque no se usa.
        location /api/ {
            proxy_pass              ${BACKEND_URL}/api/;
            proxy_http_version      1.1;
            proxy_set_header        Host              $proxy_host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_read_timeout      30s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Gzip para archivos de texto
        gzip_static on;

        # Cabeceras de seguridad
        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header X-XSS-Protection       "1; mode=block"                    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    }
}
