name: Deploy

on:
  push:
    branches: [develop, main]

# Necesario para que GitHub firme el token OIDC que asume el rol AWS
permissions:
  id-token: write
  contents: read

# Visibles en todos los jobs. ENV_NAME mapea rama → entorno.
env:
  AWS_REGION: us-east-1
  ENV_NAME: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

# Pipeline visual: Quality gate → Build → Deploy, jobs encadenados con needs:.
# NOTA: build y deploy declaran `environment:` porque el trust del rol IAM se
# restringe por environment (repo:<org>/<repo>:environment:<env>); ambos asumen
# el rol vía OIDC. Si más adelante agregas required reviewers al environment,
# la aprobación se pediría al entrar a cada uno de esos dos jobs.
jobs:
  test:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Audit (alta/crítica falla el deploy)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests + coverage
        run: npm run test:ci

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Inyectar BACKEND_URL desde SSM
        run: |
          BACKEND_URL=$(aws ssm get-parameter \
            --name "/online-store/${ENV_NAME}/backend-url" \
            --query 'Parameter.Value' --output text)
          echo "::add-mask::$BACKEND_URL"
          BACKEND_URL="$BACKEND_URL" npm run inject-env
      - name: Build
        run: npm run build
      - name: Subir dist como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/solution-test-ventas/browser/
          retention-days: 1

  deploy:
    name: Deploy a S3 + CloudFront
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Descargar dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Sync assets a S3 (cache-control inmutable)
        run: |
          aws s3 sync dist/ \
            "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
      - name: Subir index.html sin cache
        run: |
          aws s3 cp dist/index.html \
            "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-store, no-cache, must-revalidate" \
            --content-type "text/html"
      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
